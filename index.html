    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // text from that direct parent; requests from below are honored only

      // root's never-relay rule) are what hold in fully opaque chains

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

k */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7b2c6bd9-db65-4470-9792-69c2b29dfd34\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c81b2e7f-e3a8-4423-9d45-89b5caf8c68e\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"676b6baf-2023-48ab-8734-bbc4fdaaee6d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e9be4492-3aec-479c-a4ed-f11cffdd6981\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"aa62ebff-0746-4bb0-8f08-41e194e62ffd\"><\u002Fscript>\n  <script type=\"module\" src=\"a1be0512-cf2f-44cf-8763-bcb13032d8f7\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; height: 100%; }\n    @keyframes shakeX {\n      0%, 100% { transform: translateX(0); }\n      20% { transform: translateX(-8px); }\n      40% { transform: translateX(7px); }\n      60% { transform: translateX(-5px); }\n      80% { transform: translateX(4px); }\n    }\n    @keyframes toastUp {\n      0% { opacity: 0; transform: translate(-50%, 0); }\n      15% { opacity: 1; transform: translate(-50%, -8px); }\n      80% { opacity: 1; transform: translate(-50%, -34px); }\n      100% { opacity: 0; transform: translate(-50%, -46px); }\n    }\n    input:focus-visible, button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n    @keyframes autopilotGlow {\n      0%, 100% { text-shadow: 0 0 6px rgba(255,200,87,0.55), 0 0 16px rgba(255,200,87,0.28); }\n      50% { text-shadow: 0 0 12px rgba(255,200,87,0.95), 0 0 30px rgba(255,200,87,0.55); }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;width:100%;background:var(--color-bg);display:flex;align-items:flex-start;justify-content:center;font-family:var(--font-body);color:var(--color-text);padding:var(--space-8);box-sizing:border-box;\">\n  <div style=\"width:min(100%, 640px);display:flex;flex-direction:column;gap:var(--space-3);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"display:flex;align-items:center;gap:10px;min-width:0;\">\n        <img src=\"8962c19a-1392-465b-a8dd-cd831f6cf5d1\" alt=\"ACCELQ\" style=\"width:26px;height:26px;display:block;flex:none;\">\n        <div style=\"font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:12.5px;letter-spacing:0.07em;text-transform:uppercase;color:var(--color-accent-300);line-height:1.25;\">ACCELQ<br><span style=\"color:var(--color-neutral-500);letter-spacing:0.05em;\">Automation Maturity Run<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:var(--space-4);font-size:12px;color:var(--color-neutral-400);\">\n        <div>{{ timeLabel }}<\u002Fdiv>\n        <div>Score <span style=\"color:var(--color-accent-200);font-family:var(--font-heading);\">{{ score }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:4px;\">\n          <sc-for list=\"{{ pips }}\" as=\"pip\" hint-placeholder-count=\"4\">\n            <div style=\"{{ pip.style }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--color-neutral-500);gap:var(--space-3);\">\n      <div>{{ playerLine }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:var(--space-3);\">\n        <div style=\"{{ comboStyle }}\">{{ comboLabel }}<\u002Fdiv>\n        <div style=\"{{ maturityLabelStyle }}\">{{ maturityLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"{{ stageWrapStyle }}\">\n      <x-import component-from-global-scope=\"accelq-runner-3d\" hint-size=\"100%,100%\" style=\"position:absolute;inset:0;width:100%;height:100%;\"><\u002Fx-import>\n\n      <sc-for list=\"{{ toasts }}\" as=\"toast\" hint-placeholder-count=\"0\">\n        <div style=\"{{ toast.style }}\">{{ toast.text }}<\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ isEntry }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;inset:0;background:color-mix(in srgb, var(--color-bg) 88%, transparent);display:flex;align-items:center;justify-content:center;padding:var(--space-6);box-sizing:border-box;\">\n          <div style=\"width:100%;max-width:320px;display:flex;flex-direction:column;gap:var(--space-4);\">\n            <div>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;\">\n                <img src=\"8962c19a-1392-465b-a8dd-cd831f6cf5d1\" alt=\"ACCELQ\" style=\"width:34px;height:34px;display:block;\">\n                <h2 style=\"margin:0;font-size:22px;line-height:1.15;\">ACCELQ<br>Automation Maturity Run<\u002Fh2>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:12.5px;color:var(--color-neutral-300);line-height:1.55;\">Race through an ACCELQ-inspired automation pipeline. Collect testing capabilities, clear bottlenecks, and unlock <b style=\"color:#ffd87a;animation:autopilotGlow 1.6s ease-in-out infinite;\">Autopilot<\u002Fb> to smash through every obstacle and become the Ultimate Tester. Hitting an obstacle costs you points, so dodge, bust or shield.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-3);align-items:flex-start;\">\n              <label style=\"display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-400);\">\n                Name\n                <input value=\"{{ nameValue }}\" sc-camel-on-change=\"{{ onNameChange }}\" placeholder=\"Enter name\" style=\"{{ inputStyle }}\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-400);\">\n                Company\n                <input value=\"{{ companyValue }}\" sc-camel-on-change=\"{{ onCompanyChange }}\" placeholder=\"Enter company\" style=\"{{ inputStyle }}\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;\">\n              <div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-400);\">Choose your tester<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\">\n                <sc-for list=\"{{ avatars }}\" as=\"av\" hint-placeholder-count=\"6\">\n                  <button style=\"{{ av.style }}\" sc-camel-on-click=\"{{ av.pick }}\" title=\"{{ av.label }}\"><img src=\"{{ av.src }}\" alt=\"{{ av.label }}\" style=\"width:100%;height:100%;display:block;border-radius:50%;pointer-events:none;\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showEntryError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;color:var(--color-accent-200);\">{{ entryErrorText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;\">\n              <button style=\"{{ btnPrimaryStyle }}\" sc-camel-on-click=\"{{ startGame }}\">Start Run<\u002Fbutton>\n              <button style=\"{{ btnDemoStyle }}\" sc-camel-on-click=\"{{ openCalendly }}\">Book a demo<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:var(--color-neutral-500);line-height:1.4;\">Touch: swipe ← → to change lane, swipe ↑ or tap to jump, swipe ↓ to slide.<br>Keyboard: arrows / WASD / Space.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;background:color-mix(in srgb, var(--color-bg) 90%, transparent);display:flex;align-items:center;justify-content:center;padding:var(--space-4);box-sizing:border-box;overflow:auto;\">\n          <div style=\"background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--space-4) var(--space-5);width:100%;max-width:330px;margin:auto;display:flex;flex-direction:column;gap:var(--space-2);align-items:center;text-align:center;\">\n            <sc-if value=\"{{ resultShowMark }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:48px;height:48px;border-radius:var(--radius-md);background:var(--color-accent-900);border:1px solid var(--color-accent);display:flex;align-items:center;justify-content:center;\">\n                <div style=\"width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:15px solid var(--color-accent);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:relative;width:96px;height:96px;flex:none;margin:26px 0 12px;\">\n                <div style=\"{{ avatarRingStyle }}\">\n                  <img src=\"{{ photoSrc }}\" alt=\"Your tester\" style=\"{{ photoImgStyle }}\">\n                <\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 120 120\" style=\"position:absolute;left:-5px;top:-23px;width:99px;height:99px;pointer-events:none;overflow:visible;\">\n                  <sc-if value=\"{{ propCrown }}\" hint-placeholder-val=\"{{ false }}\">\n                    <g>\n                      <path d=\"M22 44 L22 20 L40 33 L60 12 L80 33 L98 20 L98 44 Z\" fill=\"#ffc857\" stroke=\"#fff0c2\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath>\n                      <rect x=\"20\" y=\"44\" width=\"80\" height=\"11\" rx=\"4\" fill=\"#ffb02e\" stroke=\"#fff0c2\" stroke-width=\"2\"><\u002Frect>\n                      <circle cx=\"60\" cy=\"26\" r=\"5\" fill=\"#37e0d8\"><\u002Fcircle>\n                      <circle cx=\"30\" cy=\"18\" r=\"3.6\" fill=\"#ff5470\"><\u002Fcircle>\n                      <circle cx=\"90\" cy=\"18\" r=\"3.6\" fill=\"#ff5470\"><\u002Fcircle>\n                    <\u002Fg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ propHat }}\" hint-placeholder-val=\"{{ false }}\">\n                    <g>\n                      <rect x=\"34\" y=\"6\" width=\"52\" height=\"42\" rx=\"4\" fill=\"#2a2440\" stroke=\"#ffb3dc\" stroke-width=\"2\"><\u002Frect>\n                      <rect x=\"34\" y=\"34\" width=\"52\" height=\"9\" fill=\"#ff7ac6\"><\u002Frect>\n                      <rect x=\"18\" y=\"46\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#2a2440\" stroke=\"#ffb3dc\" stroke-width=\"2\"><\u002Frect>\n                    <\u002Fg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ propCap }}\" hint-placeholder-val=\"{{ false }}\">\n                    <g>\n                      <path d=\"M22 52 A38 38 0 0 1 98 52 Z\" fill=\"#9184d9\" stroke=\"#d9d2ff\" stroke-width=\"2\"><\u002Fpath>\n                      <path d=\"M98 52 L118 58 A8 8 0 0 1 112 62 L96 60 Z\" fill=\"#6f61bd\" stroke=\"#d9d2ff\" stroke-width=\"2\"><\u002Fpath>\n                      <circle cx=\"60\" cy=\"16\" r=\"4.5\" fill=\"#ffc857\"><\u002Fcircle>\n                    <\u002Fg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ propBeanie }}\" hint-placeholder-val=\"{{ false }}\">\n                    <g>\n                      <path d=\"M24 54 A36 40 0 0 1 96 54 Z\" fill=\"#37e0d8\" stroke=\"#bff6f2\" stroke-width=\"2\"><\u002Fpath>\n                      <path d=\"M44 20 L40 52 M60 14 L60 52 M76 20 L80 52\" stroke=\"#1f9f98\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n                      <rect x=\"19\" y=\"48\" width=\"82\" height=\"13\" rx=\"6\" fill=\"#1f9f98\" stroke=\"#bff6f2\" stroke-width=\"2\"><\u002Frect>\n                      <circle cx=\"60\" cy=\"12\" r=\"8\" fill=\"#bff6f2\" stroke=\"#37e0d8\" stroke-width=\"2\"><\u002Fcircle>\n                    <\u002Fg>\n                  <\u002Fsc-if>\n                <\u002Fsvg>\n                <div style=\"{{ propBadgeStyle }}\">{{ propBadge }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <h3 style=\"margin:0;font-size:18px;color:{{ resultTitleColor }};\">{{ resultTitle }}<\u002Fh3>\n            <div style=\"font-size:12.5px;color:var(--color-neutral-400);line-height:1.5;\">{{ resultSubtitle }}<\u002Fdiv>\n            <div style=\"width:100%;display:flex;flex-direction:column;\">\n              <sc-for list=\"{{ resultStats }}\" as=\"stat\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--color-divider);color:var(--color-neutral-300);\">\n                  <span>{{ stat.label }}<\u002Fspan>\n                  <span style=\"color:var(--color-neutral-100);font-family:var(--font-heading);\">{{ stat.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;padding-top:var(--space-2);\">\n              <div style=\"font-size:12.5px;color:var(--color-accent-200);line-height:1.5;\">{{ demoMessage }}<\u002Fdiv>\n              <button style=\"{{ btnDemoStyle }}\" sc-camel-on-click=\"{{ openCalendly }}\">Book a demo<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-3);\">\n              <button style=\"{{ btnPrimaryStyle }}\" sc-camel-on-click=\"{{ startGame }}\">Run Again<\u002Fbutton>\n              <button style=\"{{ btnGhostStyle }}\" sc-camel-on-click=\"{{ backToEntry }}\">Change player<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"font-size:11px;color:var(--color-neutral-600);max-width:200px;line-height:1.4;\">Swipe the stage to move, jump and slide. Pick the open gate.<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;\">\n        <button style=\"{{ mobileBtnStyle }}\" sc-camel-on-click=\"{{ moveLeft }}\" aria-label=\"Move left\">←<\u002Fbutton>\n        <button style=\"{{ mobileBtnStyle }}\" sc-camel-on-click=\"{{ jump }}\" aria-label=\"Jump\">↑<\u002Fbutton>\n        <button style=\"{{ mobileBtnStyle }}\" sc-camel-on-click=\"{{ slide }}\" aria-label=\"Slide\">↓<\u002Fbutton>\n        <button style=\"{{ mobileBtnStyle }}\" sc-camel-on-click=\"{{ moveRight }}\" aria-label=\"Move right\">→<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);box-shadow:var(--shadow-sm);\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);\">\n        <div style=\"font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-300);\">Leaderboard<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);\">\n          <div style=\"font-size:11px;color:var(--color-neutral-600);\">Best score per player<\u002Fdiv>\n          <button style=\"{{ btnGhostStyle }}\" sc-camel-on-click=\"{{ exportExcel }}\">Export<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasScores }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;\">\n          <sc-for list=\"{{ leaderboard }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"{{ row.rowStyle }}\">\n              <span style=\"width:20px;color:var(--color-neutral-600);font-family:var(--font-heading);\">{{ row.rank }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ row.name }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-neutral-500);\">{{ row.company }}<\u002Fspan>\n              <span style=\"{{ row.demoStyle }}\">{{ row.demo }}<\u002Fspan>\n              <span style=\"width:44px;text-align:right;font-family:var(--font-heading);color:var(--color-accent-200);\">{{ row.score }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noScores }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:12px;color:var(--color-neutral-600);padding:var(--space-2) 0;\">No runs yet — finish a run to appear here.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);\">\n      <div style=\"font-size:11.5px;color:var(--color-neutral-500);line-height:1.4;\">{{ demoMessage }}<\u002Fdiv>\n      <button style=\"{{ btnDemoStyle }}\" sc-camel-on-click=\"{{ openCalendly }}\">Book a demo<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-2);\">\n      <button style=\"{{ adminToggleStyle }}\" sc-camel-on-click=\"{{ toggleAdmin }}\">{{ adminToggleLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ adminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);box-shadow:var(--shadow-sm);\">\n          <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-400);\">\n            Calendly link\n            <input value=\"{{ calendlyDraft }}\" sc-camel-on-change=\"{{ onCalendlyChange }}\" placeholder=\"https://calendly.com/your-team/accelq-demo\" style=\"{{ inputStyle }}\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-400);\">\n            Demo message\n            <input value=\"{{ messageDraft }}\" sc-camel-on-change=\"{{ onMessageChange }}\" placeholder=\"See how ACCELQ automates this for real\" style=\"{{ inputStyle }}\">\n          <\u002Flabel>\n          <div style=\"display:flex;align-items:center;gap:var(--space-3);\">\n            <button style=\"{{ btnPrimaryStyle }}\" sc-camel-on-click=\"{{ saveAdmin }}\">Save<\u002Fbutton>\n            <button style=\"{{ btnGhostStyle }}\" sc-camel-on-click=\"{{ resetAdmin }}\">Reset to default<\u002Fbutton>\n            <sc-if value=\"{{ adminSaved }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:12px;color:var(--color-accent-200);\">Saved<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--color-neutral-600);line-height:1.45;\">Saved on this browser. The Book a demo buttons open this link in a new tab.<\u002Fdiv>\n          <div style=\"height:1px;background:var(--color-divider);\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;\">\n            <button style=\"{{ btnGhostStyle }}\" sc-camel-on-click=\"{{ resetBoard }}\">{{ resetBoardLabel }}<\u002Fbutton>\n            <span style=\"font-size:11px;color:var(--color-neutral-600);\">Clears all names, scores and demo flags on this browser.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:500,&quot;height&quot;:1100},&quot;calendlyUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://calendly.com/accelq/accelq-demo-meeting-with-nikhilyuvarani&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo CTA&quot;},&quot;demoMessage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Want ACCELQ to do this on your real pipeline? Book a demo with our team.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo CTA&quot;},&quot;durationSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:20,&quot;max&quot;:120,&quot;step&quot;:5,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Gameplay&quot;},&quot;maxHits&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:6,&quot;step&quot;:1,&quot;section&quot;:&quot;Gameplay&quot;},&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Medium&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;Easy&quot;,&quot;Medium&quot;,&quot;Hard&quot;],&quot;section&quot;:&quot;Gameplay&quot;}}\">\nconst LS_KEY = 'accelq.leaderboard.v1';\nconst CFG_KEY = 'accelq.democonfig.v1';\n\nfunction loadConfig() {\n  try { const raw = localStorage.getItem(CFG_KEY); const o = raw ? JSON.parse(raw) : null; return o && typeof o === 'object' ? o : {}; }\n  catch (err) { return {}; }\n}\nfunction saveConfig(cfg) {\n  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (err) {}\n}\n\nfunction loadBoard() {\n  try {\n    const raw = localStorage.getItem(LS_KEY); const arr = raw ? JSON.parse(raw) : [];\n    return Array.isArray(arr) ? arr.filter(r => r && String(r.name || '').trim() && String(r.company || '').trim()) : [];\n  }\n  catch (err) { return []; }\n}\nfunction saveBoard(list) {\n  try { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 50))); } catch (err) {}\n}\n\n\nfunction makeAvatar(o) {\n  const { bg, skin, hair, hs, shirt, acc, glasses } = o;\n  let h = `<defs><radialGradient id=\"g\" cx=\"50%\" cy=\"35%\" r=\"80%\"><stop offset=\"0\" stop-color=\"${bg}\" stop-opacity=\".95\"/><stop offset=\"1\" stop-color=\"#1b1d3a\"/><\u002FradialGradient><\u002Fdefs><rect width=\"100\" height=\"100\" fill=\"url(#g)\"/>`;\n  if (hs === 'long') h += `<path d=\"M27 46 Q24 17 50 16 Q76 17 73 46 L77 78 L23 78 Z\" fill=\"${hair}\"/>`;\n  if (hs === 'bun') h += `<circle cx=\"50\" cy=\"13\" r=\"9\" fill=\"${hair}\"/>`;\n  if (hs === 'afro') h += `<circle cx=\"50\" cy=\"35\" r=\"28\" fill=\"${hair}\"/>`;\n  h += `<path d=\"M10 100 Q12 70 50 68 Q88 70 90 100 Z\" fill=\"${shirt}\"/>`;\n  h += `<path d=\"M39 69 L50 83 L61 69 Z\" fill=\"${acc}\"/>`;\n  h += `<rect x=\"43\" y=\"56\" width=\"14\" height=\"17\" rx=\"6\" fill=\"${skin}\"/>`;\n  h += `<ellipse cx=\"31\" cy=\"44\" rx=\"3.5\" ry=\"5\" fill=\"${skin}\"/><ellipse cx=\"69\" cy=\"44\" rx=\"3.5\" ry=\"5\" fill=\"${skin}\"/>`;\n  h += `<ellipse cx=\"50\" cy=\"42\" rx=\"19\" ry=\"22\" fill=\"${skin}\"/>`;\n  if (hs === 'short' || hs === 'long' || hs === 'bun') h += `<path d=\"M30 40 Q28 17 50 17 Q72 17 70 40 Q63 27 50 27 Q37 27 30 40Z\" fill=\"${hair}\"/>`;\n  if (hs === 'buzz') h += `<path d=\"M31 36 Q32 19 50 19 Q68 19 69 36 Q60 26 50 26 Q40 26 31 36Z\" fill=\"${hair}\" opacity=\".9\"/>`;\n  if (hs === 'afro') h += `<path d=\"M32 36 Q36 24 50 24 Q64 24 68 36 Q60 30 50 30 Q40 30 32 36Z\" fill=\"${hair}\"/>`;\n  if (hs === 'curly') {\n    for (let i = 0; i < 7; i++) { const a = Math.PI * (1.08 + i * 0.14); h += `<circle cx=\"${(50 + Math.cos(a) * 20).toFixed(1)}\" cy=\"${(38 + Math.sin(a) * 21).toFixed(1)}\" r=\"7.5\" fill=\"${hair}\"/>`; }\n    h += `<path d=\"M31 36 Q36 26 50 26 Q64 26 69 36 Q60 31 50 31 Q40 31 31 36Z\" fill=\"${hair}\"/>`;\n  }\n  h += `<circle cx=\"43\" cy=\"44\" r=\"2.3\" fill=\"#1d1830\"/><circle cx=\"57\" cy=\"44\" r=\"2.3\" fill=\"#1d1830\"/>`;\n  h += `<path d=\"M44 53 Q50 58.5 56 53\" stroke=\"#8a4a55\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/>`;\n  if (glasses) h += `<circle cx=\"43\" cy=\"44\" r=\"6.2\" fill=\"none\" stroke=\"${acc}\" stroke-width=\"1.8\"/><circle cx=\"57\" cy=\"44\" r=\"6.2\" fill=\"none\" stroke=\"${acc}\" stroke-width=\"1.8\"/><path d=\"M49 44 L51 44\" stroke=\"${acc}\" stroke-width=\"1.8\"/>`;\n  h += `<path d=\"M30 42 Q50 4 70 42\" stroke=\"${acc}\" stroke-width=\"2.6\" fill=\"none\" opacity=\".0\"/>`;\n  h += `<path d=\"M31 46 Q29 58 40 60\" stroke=\"${acc}\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"41\" cy=\"60\" r=\"2.2\" fill=\"${acc}\"/>`;\n  const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">${h}<\u002Fsvg>`;\n  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);\n}\nconst AVATARS = [\n  { label: 'Ada', bg: '#2fe7df', skin: '#f0c9a8', hair: '#241d33', hs: 'long', shirt: '#7867d9', acc: '#ffc857', glasses: false },\n  { label: 'Kai', bg: '#ffc857', skin: '#c68a5e', hair: '#1b1424', hs: 'short', shirt: '#1f5f74', acc: '#2fe7df', glasses: true },\n  { label: 'Zoe', bg: '#ff7ac6', skin: '#8d5a3b', hair: '#1b1424', hs: 'afro', shirt: '#5a2f6e', acc: '#ffc857', glasses: false },\n  { label: 'Ravi', bg: '#9184d9', skin: '#b9774b', hair: '#1b1424', hs: 'buzz', shirt: '#323a68', acc: '#ff9f45', glasses: true },\n  { label: 'Mei', bg: '#6ab7ff', skin: '#f3d3b3', hair: '#2b1d2f', hs: 'bun', shirt: '#2f6e5c', acc: '#ffc857', glasses: false },\n  { label: 'Leo', bg: '#5cff9d', skin: '#e8b890', hair: '#7a4a22', hs: 'curly', shirt: '#3b2f6e', acc: '#2fe7df', glasses: false }\n].map(a => Object.assign(a, { src: makeAvatar(a) }));\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'entry', name: '', company: '', entryError: false,\n    score: 0, hits: 0, timeLeft: 50, tier1: 0, tier2: 0, autopilot: false, stage: 0,\n    combo: 0, multiplier: 1, zone: '',\n    toasts: [], shake: false, board: loadBoard(), result: null, lastKey: null,\n    cfg: loadConfig(), adminOpen: false, adminSaved: false, calendlyDraft: null, messageDraft: null,\n    avatar: 0, photo: AVATARS[0].src\n  };\n\n  toastId = 0;\n\n  componentDidMount() {\n    this._onHud = (e) => {\n      const d = e.detail;\n      this.setState({ score: d.score, hits: d.hits, timeLeft: d.timeLeft, tier1: d.tier1, tier2: d.tier2, autopilot: d.autopilot, stage: d.stage, combo: d.combo || 0, multiplier: d.multiplier || 1, zone: d.zone || '' });\n    };\n    this._onFlash = (e) => {\n      const id = ++this.toastId;\n      this.setState(s => ({ toasts: [...s.toasts, { id, text: e.detail.text, tone: e.detail.tone }] }));\n      setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 850);\n    };\n    this._onHit = () => {\n      this.setState({ shake: true });\n      setTimeout(() => this.setState({ shake: false }), 320);\n    };\n    this._onOver = (e) => this.finishRun(e.detail);\n    document.addEventListener('hud', this._onHud);\n    document.addEventListener('flash', this._onFlash);\n    document.addEventListener('hit', this._onHit);\n    document.addEventListener('over', this._onOver);\n  }\n\n  pickAvatar = (i) => { this.setState({ avatar: i, photo: AVATARS[i].src }); };\n\n  componentWillUnmount() {\n    document.removeEventListener('hud', this._onHud);\n    document.removeEventListener('flash', this._onFlash);\n    document.removeEventListener('hit', this._onHit);\n    document.removeEventListener('over', this._onOver);\n  }\n\n  game() { return window.__accelqGame || document.querySelector('accelq-runner-3d'); }\n\n  hatFor(score) {\n    const HATS = [\n      { kind: 'beanie', min: 0, badge: 'Rookie Runner · Beanie', accent: '#37e0d8', name: 'Beanie' },\n      { kind: 'cap', min: 1000, badge: 'Pro Runner · Cap', accent: '#9184d9', name: 'Cap' },\n      { kind: 'hat', min: 2500, badge: 'Elite Runner · Top Hat', accent: '#ff7ac6', name: 'Top Hat' },\n      { kind: 'crown', min: 5000, badge: 'Legend · Crown', accent: '#ffc857', name: 'Crown' }\n    ];\n    let idx = 0;\n    for (let i = 0; i < HATS.length; i++) if (score >= HATS[i].min) idx = i;\n    const next = HATS[idx + 1];\n    return Object.assign({}, HATS[idx], { next: next ? next.name + ' at ' + next.min : null });\n  }\n\n  tierFor(d) {\n    if (d.failed) return 'Release Stalled';\n    if (d.autopilot) return 'Ultimate Tester';\n    if (d.tier2.length >= 1) return 'Agentic Tester';\n    if (d.tier1.length >= 4) return 'Automation Engineer';\n    return 'Manual Tester';\n  }\n\n  startGame = () => {\n    const name = (this.state.name || '').trim();\n    const company = (this.state.company || '').trim();\n    if (!name || !company) { this.setState({ entryError: true }); return; }\n    const el = this.game();\n    if (!el || !el.start) { setTimeout(this.startGame, 250); return; }\n    el.setAttribute('duration', String(this.props.durationSeconds ?? 50));\n    el.setAttribute('max-hits', String(this.props.maxHits ?? 4));\n    el.setAttribute('difficulty', this.props.difficulty ?? 'Medium');\n    el.start();\n    this.setState({\n      screen: 'playing', entryError: false, result: null,\n      score: 0, hits: 0, timeLeft: this.props.durationSeconds ?? 50, tier1: 0, tier2: 0, autopilot: false, stage: 0, toasts: []\n    });\n  };\n\n  backToEntry = () => {\n    const el = this.game();\n    if (el && el.stop) el.stop();\n    this.setState({ screen: 'entry' });\n  };\n\n  finishRun(d) {\n    const name = (this.state.name || '').trim();\n    const company = (this.state.company || '').trim();\n    const tier = this.tierFor(d);\n    if (!name || !company) { this.setState({ screen: 'result', result: d }); return; }\n    const key = (name + '|' + company).toLowerCase();\n    const board = loadBoard();\n    const existing = board.find(r => r.key === key);\n    if (existing) {\n      if (d.score > existing.score) { existing.score = d.score; existing.tier = tier; existing.date = Date.now(); }\n      existing.runs = (existing.runs || 1) + 1;\n      if (this.state.photo) existing.photo = this.state.photo; existing.avatar = AVATARS[this.state.avatar].label;\n    } else {\n      board.push({ key, name, company, score: d.score, tier, date: Date.now(), runs: 1, demo: false, photo: this.state.photo || null, avatar: AVATARS[this.state.avatar].label });\n    }\n    board.sort((a, b) => b.score - a.score);\n    saveBoard(board);\n    this.setState({ screen: 'result', result: d, board, lastKey: key });\n  }\n\n  calendlyUrl() {\n    return (this.state.cfg.url || this.props.calendlyUrl || 'https://calendly.com/accelq/demo').trim();\n  }\n  demoMessage() {\n    return this.state.cfg.message || this.props.demoMessage || 'Want ACCELQ to do this on your real pipeline? Book a demo with our team.';\n  }\n  openCalendly = () => {\n    const url = this.calendlyUrl();\n    const key = this.state.lastKey || ((this.state.name || '').trim() + '|' + (this.state.company || '').trim()).toLowerCase();\n    if (key && key !== '|') {\n      const board = loadBoard();\n      const row = board.find(r => r.key === key);\n      if (row) { row.demo = true; saveBoard(board); this.setState({ board }); }\n    }\n    if (!url) return;\n    window.open(/^https?:\\/\\//i.test(url) ? url : 'https://' + url, '_blank', 'noopener,noreferrer');\n  };\n\n  resetBoard = () => {\n    if (!this.state.confirmReset) { this.setState({ confirmReset: true }); return; }\n    saveBoard([]);\n    this.setState({ board: [], lastKey: null, confirmReset: false });\n  };\n\n  exportExcel = () => {\n    const board = loadBoard().slice().sort((a, b) => b.score - a.score);\n    const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n    const rows = board.map((r, i) => {\n      const pic = esc(r.avatar || '');\n      return `<tr><td>${i + 1}<\u002Ftd><td>${esc(r.name)}<\u002Ftd><td>${esc(r.company)}<\u002Ftd><td>${r.score}<\u002Ftd><td>${esc(r.tier)}<\u002Ftd><td>${r.demo ? 'Yes' : 'No'}<\u002Ftd><td>${r.runs || 1}<\u002Ftd><td>${r.date ? new Date(r.date).toLocaleString() : ''}<\u002Ftd><td>${pic}<\u002Ftd><\u002Ftr>`;\n    }).join('');\n    const html = `<html xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:x=\"urn:schemas-microsoft-com:office:excel\"><head><meta charset=\"utf-8\" /><\u002Fhead><body><table border=\"1\"><thead><tr><th>Rank<\u002Fth><th>Name<\u002Fth><th>Company<\u002Fth><th>Best score<\u002Fth><th>Maturity tier<\u002Fth><th>Booked demo<\u002Fth><th>Runs<\u002Fth><th>Last played<\u002Fth><th>Photo<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable><\u002Fbody><\u002Fhtml>`;\n    const blob = new Blob(['\\ufeff' + html], { type: 'application/vnd.ms-excel' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'automation-maturity-run-leaderboard.xls';\n    document.body.appendChild(a);\n    a.click();\n    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);\n  };\n  toggleAdmin = () => this.setState(s => ({\n    adminOpen: !s.adminOpen, adminSaved: false,\n    calendlyDraft: s.calendlyDraft === null ? this.calendlyUrl() : s.calendlyDraft,\n    messageDraft: s.messageDraft === null ? this.demoMessage() : s.messageDraft\n  }));\n  onCalendlyChange = (e) => this.setState({ calendlyDraft: e.target.value, adminSaved: false });\n  onMessageChange = (e) => this.setState({ messageDraft: e.target.value, adminSaved: false });\n  saveAdmin = () => {\n    const cfg = { url: (this.state.calendlyDraft || '').trim(), message: (this.state.messageDraft || '').trim() };\n    if (!cfg.url) delete cfg.url;\n    if (!cfg.message) delete cfg.message;\n    saveConfig(cfg);\n    this.setState({ cfg, adminSaved: true });\n  };\n  resetAdmin = () => {\n    saveConfig({});\n    this.setState({ cfg: {}, adminSaved: true, calendlyDraft: this.props.calendlyUrl || 'https://calendly.com/accelq/demo', messageDraft: this.props.demoMessage || 'Want ACCELQ to do this on your real pipeline? Book a demo with our team.' });\n  };\n\n  moveLeft = () => { const el = this.game(); if (el && el.moveLeft) el.moveLeft(); };\n  moveRight = () => { const el = this.game(); if (el && el.moveRight) el.moveRight(); };\n  jump = () => { const el = this.game(); if (el && el.jump) el.jump(); };\n  slide = () => { const el = this.game(); if (el && el.slide) el.slide(); };\n  onNameChange = (e) => this.setState({ name: e.target.value, entryError: false });\n  onCompanyChange = (e) => this.setState({ company: e.target.value, entryError: false });\n\n  renderVals() {\n    const s = this.state;\n    const maxHits = this.props.maxHits ?? 4;\n    const d = s.result;\n\n    const pips = Array.from({ length: maxHits }).map((_, i) => ({\n      id: i,\n      style: `width:8px;height:8px;border-radius:2px;background:${i < s.hits ? 'var(--color-neutral-700)' : 'var(--color-accent)'};`\n    }));\n\n    const toneColor = { good: 'var(--color-accent-200)', bad: 'var(--color-neutral-200)', power: 'var(--color-accent-100)' };\n    const toasts = s.toasts.map(t => ({\n      id: t.id, text: t.text,\n      style: `position:absolute;left:50%;bottom:16%;transform:translate(-50%,0);font-size:13.5px;` +\n        `font-family:var(--font-heading);font-weight:var(--font-heading-weight);white-space:nowrap;pointer-events:none;` +\n        `text-shadow:0 2px 6px rgba(0,0,0,0.9);color:${toneColor[t.tone] || 'var(--color-neutral-200)'};animation:toastUp 0.85s ease forwards;`\n    }));\n\n    const maturityTitles = ['Manual Tester', 'Automation Engineer', 'Agentic Tester'];\n    const maturityLabel = s.screen === 'playing' ? (s.autopilot ? 'ULTIMATE TESTER' : maturityTitles[s.stage]) : (s.name ? s.name : 'Ready');\n\n    let resultTitle = '', resultSubtitle = '', resultTitleColor = 'var(--color-neutral-100)', resultShowMark = false, resultStats = [];\n    if (d) {\n      const tier = this.tierFor(d);\n      resultTitle = d.failed ? 'Release Stalled' : tier;\n      resultTitleColor = d.autopilot ? 'var(--color-accent-200)' : (d.failed ? 'var(--color-neutral-200)' : 'var(--color-neutral-100)');\n      resultShowMark = !!d.autopilot && !d.failed;\n      resultSubtitle = d.failed\n        ? 'Too many unhandled use-cases broke the run — the release ships slow and fragile.'\n        : d.autopilot\n          ? 'Every automatable use-case got busted on sight. Release shipped fast.'\n          : d.tier2.length >= 1\n            ? 'Agentic capabilities came online, but Autopilot never engaged.'\n            : d.tier1.length >= 4\n              ? 'Solid automation coverage — agentic maturity is still ahead.'\n              : 'Coverage stayed thin — releases stay slow and fragile.';\n      const prev = s.board.find(r => r.key === s.lastKey);\n      resultStats = [\n        { label: 'Score', value: String(d.score) },\n        { label: 'Personal best', value: prev ? String(prev.score) : String(d.score) },\n        { label: 'Capabilities (automation · agentic)', value: `${d.tier1.length}/${d.tier1Total} · ${d.tier2.length}/${d.tier2Total}` },\n        { label: 'Best combo', value: String(d.bestCombo || 0) },\n        { label: 'Autopilot engaged', value: d.autopilot ? 'Yes' : 'No' },\n        { label: 'Obstacles smashed · power-ups', value: String(d.smashed || 0) + ' · ' + String(d.powerups || 0) },\n        { label: 'Points lost to obstacles', value: '-' + String(d.lost || 0) },\n        { label: 'Hat earned · next', value: this.hatFor(d.score).name + ' · ' + (this.hatFor(d.score).next || 'max rank') },\n        { label: 'Escaped defects', value: String(d.hits) }\n      ];\n    }\n\n    const leaderboard = s.board.slice(0, 8).map((r, i) => ({\n      id: r.key, rank: i + 1, name: r.name, company: r.company, tier: r.tier, score: r.score,\n      demo: r.demo ? 'Demo' : '—',\n      demoStyle: `font-size:11px;font-family:var(--font-heading);color:${r.demo ? '#ffc857' : 'var(--color-neutral-700)'};`,\n      rowStyle: `display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--color-divider);` +\n        `color:${r.key === s.lastKey ? 'var(--color-accent-100)' : 'var(--color-neutral-200)'};`\n    }));\n\n    const mins = Math.floor(s.timeLeft / 60), secs = Math.max(0, s.timeLeft % 60);\n    const tierName = d ? (d.failed ? 'Release Stalled' : this.tierFor(d)) : '';\n    const hat = d ? this.hatFor(d.score) : null;\n    const propKind = hat ? hat.kind : '';\n    const propBadgeText = hat ? hat.badge : '';\n    const propAccent = hat ? hat.accent : 'var(--color-neutral-600)';\n\n    return {\n      isEntry: s.screen === 'entry',\n      avatars: AVATARS.map((av, i) => ({\n        src: av.src, label: av.label, pick: () => this.pickAvatar(i),\n        style: `cursor:pointer;padding:0;width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--color-neutral-900);touch-action:manipulation;-webkit-tap-highlight-color:transparent;` +\n          (i === s.avatar ? 'border:2px solid var(--color-accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--color-accent) 30%, transparent);transform:scale(1.06);' : 'border:2px solid var(--color-divider);opacity:.8;')\n      })),\n      hasPhoto: !!s.photo,\n      photoSrc: s.photo || '',\n      photoImgStyle: `position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;`,\n      avatarRingStyle: `position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden;border:3px solid ${propAccent};` +\n        `box-shadow:0 0 0 4px color-mix(in srgb, ${propAccent} 18%, transparent);background:var(--color-neutral-900);`,\n      propCrown: propKind === 'crown',\n      propHat: propKind === 'hat',\n      propCap: propKind === 'cap',\n      propBeanie: propKind === 'beanie',\n      propBadge: propBadgeText,\n      propBadgeStyle: `position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;` +\n        `font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;` +\n        `color:#14121f;background:${propAccent};padding:3px 9px;border-radius:999px;`,\n      isResult: s.screen === 'result',\n      showEntryError: s.entryError,\n      nameValue: s.name,\n      companyValue: s.company,\n      onNameChange: this.onNameChange,\n      onCompanyChange: this.onCompanyChange,\n      startGame: this.startGame,\n      backToEntry: this.backToEntry,\n      moveLeft: this.moveLeft,\n      moveRight: this.moveRight,\n      jump: this.jump,\n      slide: this.slide,\n      openCalendly: this.openCalendly,\n      exportExcel: this.exportExcel,\n      resetBoard: this.resetBoard,\n      resetBoardLabel: s.confirmReset ? 'Click again to confirm' : 'Reset leaderboard',\n      toggleAdmin: this.toggleAdmin,\n      saveAdmin: this.saveAdmin,\n      resetAdmin: this.resetAdmin,\n      onCalendlyChange: this.onCalendlyChange,\n      onMessageChange: this.onMessageChange,\n      demoMessage: this.demoMessage(),\n      calendlyDraft: s.calendlyDraft === null ? this.calendlyUrl() : s.calendlyDraft,\n      messageDraft: s.messageDraft === null ? this.demoMessage() : s.messageDraft,\n      adminOpen: s.adminOpen,\n      adminSaved: s.adminSaved,\n      adminToggleLabel: s.adminOpen ? 'Close admin settings' : 'Admin settings',\n      adminToggleStyle: `align-self:flex-start;background:transparent;border:none;padding:0;cursor:pointer;font-family:var(--font-body);` +\n        `font-size:11.5px;color:var(--color-neutral-600);text-decoration:underline;text-underline-offset:3px;`,\n      btnDemoStyle: `display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:var(--font-heading);` +\n        `font-weight:var(--font-heading-weight);font-size:14px;letter-spacing:0.02em;color:#14121f;` +\n        `background:linear-gradient(135deg, #ffd87a 0%, #ffc857 45%, #ffa83c 100%);` +\n        `border:1px solid #ffe6a8;padding:11px 20px;border-radius:var(--radius-md);white-space:nowrap;` +\n        `box-shadow:0 0 0 3px color-mix(in srgb, #ffc857 22%, transparent), 0 6px 18px -6px rgba(255,200,87,0.6);`,\n      comboLabel: s.screen === 'playing' ? (s.combo > 0 ? `x${s.multiplier} · ${s.combo} streak` : 'no streak') : (s.zone || ''),\n      comboStyle: `font-family:var(--font-heading);font-weight:var(--font-heading-weight);letter-spacing:0.04em;color:${s.multiplier >= 3 ? '#ffc857' : s.combo > 0 ? '#37e0d8' : 'var(--color-neutral-600)'};`,\n      score: s.score,\n      timeLabel: s.screen === 'playing' ? `${mins}:${String(secs).padStart(2, '0')}` : '--:--',\n      playerLine: s.screen === 'playing'\n        ? `${s.zone || 'Pipeline'} · Automation ${s.tier1}/8 · Agentic ${s.tier2}/4`\n        : (s.name && s.company ? `${s.name} · ${s.company}` : 'Enter player details to begin'),\n      maturityLabel,\n      maturityLabelStyle: `font-family:var(--font-heading);font-weight:var(--font-heading-weight);letter-spacing:0.06em;color:${s.autopilot ? 'var(--color-accent-200)' : (s.stage === 1 ? 'var(--color-accent-300)' : 'var(--color-neutral-500)')};`,\n      pips, toasts,\n      resultTitle, resultSubtitle, resultTitleColor, resultShowMark, resultStats,\n      leaderboard,\n      hasScores: s.board.length > 0,\n      noScores: s.board.length === 0,\n      stageWrapStyle: `position:relative;overflow:hidden;height:clamp(500px, 64vh, 780px);touch-action:${s.screen === 'playing' ? 'none' : 'auto'};-webkit-tap-highlight-color:transparent;border-radius:16px;background:#0b0d1d;border:1px solid color-mix(in srgb, #9184d9 45%, transparent);box-shadow:0 18px 45px rgba(0,0,0,.55),0 0 0 1px rgba(47,231,223,.08),inset 0 0 50px rgba(120,103,217,.12);` +\n        (s.shake ? 'animation:shakeX 0.32s ease;' : ''),\n      inputStyle: `width:100%;box-sizing:border-box;background:var(--color-neutral-900);border:1px solid var(--color-divider);border-radius:var(--radius-md);` +\n        `padding:9px 11px;color:var(--color-text);font-family:var(--font-body);font-size:16px;`,\n      btnPrimaryStyle: `display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-heading);font-weight:var(--font-heading-weight);` +\n        `font-size:14px;color:var(--color-accent);background:transparent;border:1px solid var(--color-accent);padding:8px 16px;border-radius:var(--radius-md);`,\n      btnGhostStyle: `display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-body);font-size:13px;` +\n        `color:var(--color-neutral-400);background:transparent;border:1px solid var(--color-divider);padding:8px 14px;border-radius:var(--radius-md);`,\n      mobileBtnStyle: `display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--radius-md);touch-action:manipulation;-webkit-tap-highlight-color:transparent;` +\n        `border:1px solid var(--color-divider);background:transparent;color:var(--color-text);cursor:pointer;font-size:20px;`\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
